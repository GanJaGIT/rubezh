<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>Рубеж — пробник мультиплеера</title>
    <!-- YG-01: the Yandex SDK, before the page code. -->
    <script src="/sdk.js"></script>
    <style>
      body {
        margin: 0;
        padding: 12px;
        background: #f6ead0;
        color: #2b2118;
        font:
          15px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Arial,
          sans-serif;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin: 8px 0;
      }
      button {
        min-height: 44px;
        padding: 0 16px;
        border: 2px solid #6c4325;
        border-radius: 10px;
        background: #fffaf0;
        color: #2b2118;
        font:
          700 15px system-ui,
          sans-serif;
        cursor: pointer;
      }
      button.primary {
        background: #5bb944;
        border-color: #2f7a2c;
        color: #fff;
      }
      button:disabled {
        opacity: 0.5;
      }
      input[type='number'] {
        width: 110px;
        min-height: 40px;
        padding: 0 8px;
        border: 2px solid #6c4325;
        border-radius: 8px;
        font:
          600 16px system-ui,
          sans-serif;
      }
      #status {
        padding: 8px;
        border-radius: 8px;
        background: #fffaf0;
        white-space: pre-wrap;
      }
      #log,
      #result {
        margin: 8px 0;
        padding: 8px;
        max-height: 40vh;
        overflow: auto;
        border-radius: 8px;
        background: #2b2118;
        color: #f6ead0;
        font:
          12px/1.35 ui-monospace,
          Consolas,
          monospace;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .err {
        color: #ff9a8f;
      }
    </style>
  </head>
  <body>
    <h1>Пробник асинхронного мультиплеера (ST-01)</h1>
    <div id="status">Загрузка SDK…</div>
    <div class="row">
      <label>Число (meta1): <input id="meta1" type="number" value="500" min="0" /></label>
      <button id="record" class="primary" type="button" disabled>Записать</button>
      <label><input id="noinit" type="checkbox" /> без init перед записью</label>
    </div>
    <div class="row">
      <label>meta1 от <input id="min" type="number" value="0" /></label>
      <label>до <input id="max" type="number" value="100000" /></label>
      <button id="load" class="primary" type="button" disabled>Загрузить</button>
      <button id="auth" type="button" disabled>Войти</button>
      <button id="clear" type="button">Очистить журнал</button>
    </div>
    <div>Ответ init:</div>
    <div id="result">—</div>
    <div>Журнал:</div>
    <div id="log"></div>
    <script type="module" src="./spike.ts"></script>
  </body>
</html>
